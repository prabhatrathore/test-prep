<body>
    <script>
        fetch("https://jsonplaceholder.typicode.com/users")
            .then((response) => {     //ye bhi promise hee return krr rha 
                return response.json()
            }).then((result) => {
                console.log(result)
                // document.write(result)
                for (let i in result) {
                    document.write(`${result[i].name} - ${result[i].email} - ${result[i].username} <br>`)
                }
            }).catch((error) => {
                console.log(error, 'pppppppppppppppp')
                document.write('can;t fetch')
            })

        fetch(file / URL, {
            method: "post",    //delete(delete data)  put(update data)    get(only read data)  from    server

            header: {   // body ke server pr data pr bhjne waale h wo kis format mai hoga
                'Content-Type': "application/json",//means body ke through data bhja h wo json hai 
                //   'Content-Type': "application/x-www-form-urlencoded" //jb hum body ke through formdata bhjenge 


            }
