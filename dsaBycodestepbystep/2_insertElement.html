<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        function insertEl() {
            let arr = [3, 55, 8, 6, 13, 5];
            let newElement = document.getElementById('newElement').value;
            newElement = parseInt(newElement)

            let position = document.getElementById("position").value;
            for (let i = arr.length - 1; i >= 0; i--) {// 5 4 3                 
                if (i >= position) {
                    arr[i + 1] = arr[i]
                    if (i == position) {
                        arr[position] = newElement
                    }
                }
            }
            console.log(arr, '=+++');
        };

    </script>
</head>

<body>
    <input type="text " id="position" placeholder="enter-position" />
    <input type="text " id="newElement" placeholder="enter-new-element" />
    <button onclick="insertEl()"> insert </button>


</body>

</html>
