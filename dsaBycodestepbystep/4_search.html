<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>delete-element</title>
    <script>

        function removeEl() {
            let arr = [3, 55, 8, 6, 13, 5];
            // let position = 3//iss position pr hai onko remove krna h .
            let position = document.getElementById("position").value;
            position = parseInt(position)
            for (let i = position; i < arr.length; i++) {// 5 4 3                 
                arr[i] = arr[i + 1];
            };
            arr.length = arr.length - 1
            console.log(arr, '=+++');
        };

    </script>
</head>

<body>
    <input type="text " id="position" placeholder="enter-position" />
    <!-- <input type="text " id="newElement" placeholder="enter-new-element" /> -->
    <button onclick="removeEl()"> remove element </button>


</body>

</html>
